<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f12">
  <title>Unlock Antigravity Remote</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .auth-page-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.5);
    }
    .auth-brand-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: var(--radius-lg);
      background-color: var(--surface-raised);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-brand-icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .auth-heading {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.015em;
      margin-bottom: 6px;
    }
    .auth-subtext {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .auth-token-field {
      width: 100%;
      min-height: 44px;
      background-color: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-mono);
      outline: none;
      text-align: center;
      transition: border-color 0.15s ease;
    }
    .auth-token-field:focus {
      border-color: var(--gemini-accent);
    }
    .auth-submit-btn {
      width: 100%;
      min-height: 44px;
      background-color: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .auth-submit-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    .auth-submit-btn:active {
      transform: translateY(0);
    }
    .auth-note {
      font-size: 11.5px;
      color: var(--text-tertiary);
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-brand-icon" aria-hidden="true">
        <img src="/static/icon.png" alt="Antigravity Logo">
      </div>
      <h1 class="auth-heading">Antigravity Remote</h1>
      <p class="auth-subtext">Enter your mobile authorization token or open the authenticated tunnel link from host PC.</p>
      
      <form class="auth-form" id="login-form" onsubmit="handleAuthSubmit(event)">
        <input 
          id="auth-token-input" 
          class="auth-token-field" 
          type="password" 
          placeholder="Paste mobile token" 
          autocomplete="current-password"
          required
          autofocus>
        <button type="submit" class="auth-submit-btn">Unlock Dashboard</button>
      </form>

      <p class="auth-note">Token is generated securely on host startup and printed in the desktop terminal.</p>
    </div>
  </div>

  <script>
    function handleAuthSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('auth-token-input');
      const token = input.value.trim();
      if (!token) return;

      document.cookie = 'mrt=' + encodeURIComponent(token) + ';max-age=31536000;path=/;SameSite=Lax';
      window.location.href = window.location.pathname;
    }
  </script>
</body>
</html>
