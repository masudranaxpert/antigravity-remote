<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Antigravity Remote - Web Terminal</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/static/terminal.css">
</head>
<body>
  <!-- Top Floating Notification Toast -->
  <aside id="toast" role="alert" aria-live="assertive">
    <div id="toast-icon" aria-hidden="true"></div>
    <span id="toast-msg"></span>
  </aside>

  <div class="terminal-scaffold">
    <!-- Top Compact Header (Zero overflow on 320-360px) -->
    <header class="terminal-header">
      <div class="header-left">
        <a href="/" class="nav-back-btn" title="Back to Dashboard" aria-label="Back to Dashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
      </div>

      <div class="header-center">
        <span class="status-dot active" id="term-status-dot" title="Session Connected"></span>
        <span class="session-label" id="session-label">bash &bull; remote</span>
      </div>

      <div class="header-right">
        <button type="button" class="tool-btn icon-btn" id="kbd-toggle-btn" title="Toggle Soft Keyboard" aria-label="Toggle Keyboard">⌨</button>
        <button type="button" class="tool-btn icon-btn" id="header-menu-btn" title="More Options" aria-label="More Options">⋯</button>
        <!-- Dropdown Menu for Secondary Actions -->
        <div class="header-dropdown" id="header-dropdown" hidden>
          <button type="button" class="dropdown-item" id="composer-toggle-btn">
            <span>✏️ Command Composer</span>
          </button>
          <div class="dropdown-divider"></div>
          <div class="dropdown-font-row">
            <span class="font-label">Font Size</span>
            <div class="font-controls">
              <button type="button" class="font-btn" id="font-decrease-btn" title="Decrease Font">A-</button>
              <button type="button" class="font-btn" id="font-increase-btn" title="Increase Font">A+</button>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item" id="reconnect-btn">
            <span>↻ Reconnect Terminal</span>
          </button>
          <a href="/logout" class="dropdown-item danger">
            <span>⇥ Log Out</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Slide-down Command Composer Drawer (Floating Overlay - no layout push or resize) -->
    <div class="composer-drawer" id="composer-drawer" hidden>
      <div class="composer-inner">
        <textarea id="composer-input" class="composer-textarea" rows="2" placeholder="Type or dictate command..." autocorrect="off" autocapitalize="none" autocomplete="off" spellcheck="false"></textarea>
        <div class="composer-controls">
          <button type="button" class="composer-btn send" id="composer-send-btn">Send ⏎</button>
          <button type="button" class="composer-btn close" id="composer-close-btn" aria-label="Close Composer">✕</button>
        </div>
      </div>
    </div>

    <!-- Active Terminal Canvas Mount Area -->
    <main class="terminal-main" id="terminal-main">
      <div id="terminal-container" class="terminal-canvas-wrap"></div>
      <button type="button" class="scroll-bottom-btn" id="scroll-bottom-btn" title="Scroll to Bottom" aria-label="Scroll to Bottom" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </main>

    <!-- Mobile Virtual Keyboard Accessory Touch Bar (Essential keys visible on one screen) -->
    <nav class="accessory-touch-bar" id="accessory-bar" aria-label="Terminal Mobile Keys">
      <div class="touch-bar-scroll">
        <button type="button" class="acc-btn special" tabindex="-1" data-key="escape" title="Escape">ESC</button>
        <button type="button" class="acc-btn toggle" tabindex="-1" id="ctrl-toggle-btn" title="Toggle Sticky Ctrl">CTRL</button>
        <button type="button" class="acc-btn toggle" tabindex="-1" id="alt-toggle-btn" title="Toggle Sticky Alt">ALT</button>
        <button type="button" class="acc-btn special" tabindex="-1" data-key="tab" title="Tab">TAB</button>
        <button type="button" class="acc-btn arrow" tabindex="-1" data-key="arrow-left" title="Move Left">&larr;</button>
        <button type="button" class="acc-btn arrow" tabindex="-1" data-key="arrow-down" title="Move Down">&darr;</button>
        <button type="button" class="acc-btn arrow" tabindex="-1" data-key="arrow-up" title="Move Up">&uarr;</button>
        <button type="button" class="acc-btn arrow" tabindex="-1" data-key="arrow-right" title="Move Right">&rarr;</button>
        <button type="button" class="acc-btn action" tabindex="-1" data-key="ctrl-c" title="Interrupt (Ctrl+C)">^C</button>
        <button type="button" class="acc-btn action" tabindex="-1" data-action="paste" title="Paste (📋)">📋</button>
        <button type="button" class="acc-btn action" tabindex="-1" data-action="copy" title="Copy (📑)">📑</button>
        <button type="button" class="acc-btn action" tabindex="-1" id="composer-acc-btn" title="Composer (✏️)">✏️</button>
        <button type="button" class="acc-btn symbol" tabindex="-1" data-raw="~" title="Home (~)">~</button>
        <button type="button" class="acc-btn symbol" tabindex="-1" data-raw="-" title="Dash (-)">-</button>
        <button type="button" class="acc-btn symbol" tabindex="-1" data-raw="/" title="Slash (/)">/</button>
        <button type="button" class="acc-btn symbol" tabindex="-1" data-raw="|" title="Pipe (|)">|</button>
        <button type="button" class="acc-btn symbol" tabindex="-1" data-raw="$" title="Dollar ($)">$</button>
        <button type="button" class="acc-btn symbol" tabindex="-1" data-raw="." title="Dot (.)">.</button>
        <button type="button" class="acc-btn symbol" tabindex="-1" data-raw=".." title="Parent Directory (..)">..</button>
        <button type="button" class="acc-btn special" tabindex="-1" data-key="backspace" title="Backspace (⌫)">⌫</button>
      </div>
    </nav>
  </div>

  <!-- Mobile Native Text Selection & Copy Overlay Modal -->
  <aside class="select-overlay" id="select-overlay" hidden aria-label="Select and Copy Overlay">
    <div class="select-overlay-header">
      <div class="select-overlay-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>Select / Copy Buffer</span>
      </div>
      <div class="select-overlay-actions">
        <button type="button" class="select-btn primary" id="select-copy-btn">Copy</button>
        <button type="button" class="select-btn" id="select-copy-all-btn">Copy All</button>
        <button type="button" class="select-btn close" id="select-close-btn">Done</button>
      </div>
    </div>
    <div class="select-overlay-body" id="select-overlay-body">
      <pre class="select-overlay-pre" id="select-overlay-pre"></pre>
    </div>
  </aside>

  <script src="/static/vendor/xterm/xterm.js"></script>
  <script src="/static/vendor/xterm/xterm-addon-fit.js"></script>
  <script src="/static/terminal.js"></script>
</body>
</html>
